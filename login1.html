<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hacker Authentication System</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Global styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      overflow: hidden;
    }

    section {
      position: absolute;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      overflow: hidden;
    }

    section::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(#000, #0f0, #000);
      animation: animate 5s linear infinite;
    }

    @keyframes animate {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    section span {
      position: relative;
      display: block;
      width: calc(6.25vw - 2px);
      height: calc(6.25vw - 2px);
      background: #181818;
      z-index: 2;
      transition: 1.5s;
    }

    section span:hover {
      background: #0f0;
      transition: 0s;
    }

    .form-box {
      position: absolute;
      width: 400px;
      background: #222;
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    .form-box.active {
      display: flex;
    }

    .form-box .content {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 40px;
    }

    .form-box h2 {
      font-size: 2em;
      color: #0f0;
      text-transform: uppercase;
    }

    .form-box .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .inputBox {
      position: relative;
      width: 100%;
    }

    .inputBox input {
      width: 100%;
      background: #333;
      border: none;
      outline: none;
      padding: 25px 10px 7.5px;
      border-radius: 4px;
      color: #fff;
      font-weight: 500;
      font-size: 1em;
    }

    .inputBox i {
      position: absolute;
      left: 0;
      padding: 15px 10px;
      font-style: normal;
      color: #aaa;
      transition: 0.5s;
      pointer-events: none;
    }

    .inputBox input:focus ~ i,
    .inputBox input:valid ~ i {
      transform: translateY(-7.5px);
      font-size: 0.8em;
      color: #fff;
    }

    .links {
      display: flex;
      justify-content: space-between;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    .links a:hover {
      color: #0f0;
    }

    .links a:last-child {
      color: #0f0;
      font-weight: 600;
    }

    input[type="submit"] {
      padding: 10px;
      background: #0f0;
      color: #000;
      font-weight: 600;
      font-size: 1.35em;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    input[type="submit"]:hover {
      background: #00ff00;
      box-shadow: 0 0 10px #0f0;
    }

    input[type="submit"]:active {
      opacity: 0.6;
    }

    .error-message {
      color: #ff0000;
      font-size: 0.9em;
      margin-top: 10px;
      text-align: center;
    }

    .success-message {
      color: #0f0;
      font-size: 0.9em;
      margin-top: 10px;
      text-align: center;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .dashboard {
      position: absolute;
      width: 600px;
      background: #222;
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .dashboard.active {
      display: flex;
    }

    .dashboard h2 {
      color: #0f0;
      margin-bottom: 20px;
    }

    .dashboard p {
      color: #fff;
      margin-bottom: 20px;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #ff3333;
    }

    @media (max-width: 900px) {
      section span {
        width: calc(10vw - 2px);
        height: calc(10vw - 2px);
      }
    }

    @media (max-width: 600px) {
      section span {
        width: calc(20vw - 2px);
        height: calc(20vw - 2px);
      }
      
      .form-box {
        width: 350px;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <section>
    <!-- Background animation spans -->
    <script>
      document.write('<span></span>'.repeat(160));
    </script>

    <!-- Sign In Form -->
    <div class="form-box signin active">
      <div class="content">
        <h2>Sign In</h2>
        <form class="form" id="signin-form">
          <div class="inputBox">
            <input type="text" name="username" required>
            <i>Username</i>
          </div>
          <div class="inputBox">
            <input type="password" name="password" required>
            <i>Password</i>
          </div>
          <div class="links">
            <a href="#" id="to-forgot">Forgot Password</a>
            <a href="#" id="to-signup">Signup</a>
          </div>
          <div class="inputBox">
            <input type="submit" value="Login">
          </div>
          <div id="signin-message"></div>
        </form>
      </div>
    </div>

    <!-- Sign Up Form -->
    <div class="form-box signup">
      <div class="content">
        <h2>Sign Up</h2>
        <form class="form" id="signup-form">
          <div class="inputBox">
            <input type="text" name="username" required>
            <i>Username</i>
          </div>
          <div class="inputBox">
            <input type="email" name="email" required>
            <i>Email</i>
          </div>
          <div class="inputBox">
            <input type="password" name="password" required>
            <i>Password</i>
          </div>
          <div class="inputBox">
            <input type="password" name="confirmPassword" required>
            <i>Confirm Password</i>
          </div>
          <div class="links">
            <a href="#">Already have an account?</a>
            <a href="#" id="to-signin">Login</a>
          </div>
          <div class="inputBox">
            <input type="submit" value="Register">
          </div>
          <div id="signup-message"></div>
        </form>
      </div>
    </div>

    <!-- Forgot Password Form -->
    <div class="form-box forgot">
      <div class="content">
        <h2>Forgot Password</h2>
        <form class="form" id="forgot-form">
          <div class="inputBox">
            <input type="email" name="email" required>
            <i>Email</i>
          </div>
          <div class="links">
            <a href="#" id="back-to-signin1">Back to Login</a>
            <a href="#" id="to-reset">Have Reset Code?</a>
          </div>
          <div class="inputBox">
            <input type="submit" value="Send Reset Code">
          </div>
          <div id="forgot-message"></div>
        </form>
      </div>
    </div>

    <!-- Reset Password Form -->
    <div class="form-box reset">
      <div class="content">
        <h2>Reset Password</h2>
        <form class="form" id="reset-form">
          <div class="inputBox">
            <input type="email" name="email" required>
            <i>Email</i>
          </div>
          <div class="inputBox">
            <input type="text" name="resetCode" required>
            <i>Reset Code</i>
          </div>
          <div class="inputBox">
            <input type="password" name="newPassword" required>
            <i>New Password</i>
          </div>
          <div class="inputBox">
            <input type="password" name="confirmPassword" required>
            <i>Confirm Password</i>
          </div>
          <div class="links">
            <a href="#" id="back-to-signin2">Back to Login</a>
            <a href="#" id="back-to-forgot">Back to Forgot</a>
          </div>
          <div class="inputBox">
            <input type="submit" value="Reset Password">
          </div>
          <div id="reset-message"></div>
        </form>
      </div>
    </div>

   

  <script>
    // Form elements
    const signinBox = document.querySelector('.signin');
    const signupBox = document.querySelector('.signup');
    const forgotBox = document.querySelector('.forgot');
    const resetBox = document.querySelector('.reset');
    const dashboard = document.getElementById('dashboard');

    // Navigation elements
    const toSignup = document.getElementById('to-signup');
    const toSignin = document.getElementById('to-signin');
    const toForgot = document.getElementById('to-forgot');
    const toReset = document.getElementById('to-reset');
    const backToSignin1 = document.getElementById('back-to-signin1');
    const backToSignin2 = document.getElementById('back-to-signin2');
    const backToForgot = document.getElementById('back-to-forgot');
    const logoutBtn = document.getElementById('logout-btn');

    // Forms
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const forgotForm = document.getElementById('forgot-form');
    const resetForm = document.getElementById('reset-form');

    // Message elements
    const signinMessage = document.getElementById('signin-message');
    const signupMessage = document.getElementById('signup-message');
    const forgotMessage = document.getElementById('forgot-message');
    const resetMessage = document.getElementById('reset-message');

    // User info elements
    const userInfo = document.getElementById('user-info');
    const loginTime = document.getElementById('login-time');

    // Mock database (in real app, this would be handled by backend)
    let users = JSON.parse(localStorage.getItem('hackerAuthUsers') || '[]');
    let resetCodes = JSON.parse(localStorage.getItem('hackerResetCodes') || '{}');
    let currentUser = JSON.parse(localStorage.getItem('hackerCurrentUser') || 'null');

    // Check if user is already logged in
    if (currentUser) {
      showDashboard();
    }

    // Navigation event listeners
    toSignup.addEventListener('click', e => {
      e.preventDefault();
      showForm('signup');
    });

    toSignin.addEventListener('click', e => {
      e.preventDefault();
      showForm('signin');
    });

    toForgot.addEventListener('click', e => {
      e.preventDefault();
      showForm('forgot');
    });

    toReset.addEventListener('click', e => {
      e.preventDefault();
      showForm('reset');
    });

    backToSignin1.addEventListener('click', e => {
      e.preventDefault();
      showForm('signin');
    });

    backToSignin2.addEventListener('click', e => {
      e.preventDefault();
      showForm('signin');
    });

    backToForgot.addEventListener('click', e => {
      e.preventDefault();
      showForm('forgot');
    });

    logoutBtn.addEventListener('click', logout);

    // Form submission handlers
    signinForm.addEventListener('submit', handleSignin);
    signupForm.addEventListener('submit', handleSignup);
    forgotForm.addEventListener('submit', handleForgotPassword);
    resetForm.addEventListener('submit', handleResetPassword);

    function showForm(formName) {
      // Hide all forms and dashboard
      signinBox.classList.remove('active');
      signupBox.classList.remove('active');
      forgotBox.classList.remove('active');
      resetBox.classList.remove('active');
      dashboard.classList.remove('active');

      // Show selected form
      document.querySelector(`.${formName}`).classList.add('active');

      // Clear messages
      clearMessages();
    }

    function showDashboard() {
      // Hide all forms
      signinBox.classList.remove('active');
      signupBox.classList.remove('active');
      forgotBox.classList.remove('active');
      resetBox.classList.remove('active');

      // Show dashboard
      dashboard.classList.add('active');

      // Update user info
      userInfo.textContent = currentUser.username;
      loginTime.textContent = new Date().toLocaleString();
    }

    function clearMessages() {
      signinMessage.innerHTML = '';
      signupMessage.innerHTML = '';
      forgotMessage.innerHTML = '';
      resetMessage.innerHTML = '';
    }

    function showMessage(element, message, isError = true) {
      element.innerHTML = `<div class="${isError ? 'error' : 'success'}-message">${message}</div>`;
    }

    async function handleSignin(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const username = formData.get('username');
      const password = formData.get('password');

      // Add loading state
      form.classList.add('loading');
      clearMessages();

      // Simulate API delay
      await new Promise(resolve => setTimeout(resolve, 1000));

      // Find user
      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        currentUser = { username: user.username, email: user.email };
        localStorage.setItem('hackerCurrentUser', JSON.stringify(currentUser));
        showMessage(signinMessage, 'Login successful! Redirecting...', false);
        
        setTimeout(() => {
          showDashboard();
          form.classList.remove('loading');
        }, 1000);
      } else {
        showMessage(signinMessage, 'Invalid username or password');
        form.classList.remove('loading');
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const username = formData.get('username');
      const email = formData.get('email');
      const password = formData.get('password');
      const confirmPassword = formData.get('confirmPassword');

      // Add loading state
      form.classList.add('loading');
      clearMessages();

      // Validation
      if (password !== confirmPassword) {
        showMessage(signupMessage, 'Passwords do not match');
        form.classList.remove('loading');
        return;
      }

      if (password.length < 6) {
        showMessage(signupMessage, 'Password must be at least 6 characters');
        form.classList.remove('loading');
        return;
      }

      // Check if user already exists
      if (users.find(u => u.username === username || u.email === email)) {
        showMessage(signupMessage, 'Username or email already exists');
        form.classList.remove('loading');
        return;
      }

      // Simulate API delay
      await new Promise(resolve => setTimeout(resolve, 1000));

      // Create user
      const newUser = { username, email, password };
      users.push(newUser);
      localStorage.setItem('hackerAuthUsers', JSON.stringify(users));

      showMessage(signupMessage, 'Account created successfully! Please login.', false);
      
      setTimeout(() => {
        form.reset();
        showForm('signin');
        form.classList.remove('loading');
      }, 1500);
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const email = formData.get('email');

      // Add loading state
      form.classList.add('loading');
      clearMessages();

      // Check if email exists
      const user = users.find(u => u.email === email);

      // Simulate API delay
      await new Promise(resolve => setTimeout(resolve, 1000));

      if (user) {
        // Generate reset code
        const resetCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        resetCodes[email] = {
          code: resetCode,
          timestamp: Date.now(),
          expires: Date.now() + (15 * 60 * 1000) // 15 minutes
        };
        localStorage.setItem('hackerResetCodes', JSON.stringify(resetCodes));

        showMessage(forgotMessage, `Reset code sent! Your code is: ${resetCode} (Valid for 15 minutes)`, false);
      } else {
        showMessage(forgotMessage, 'Email not found');
      }

      form.classList.remove('loading');
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const email = formData.get('email');
      const resetCode = formData.get('resetCode');
      const newPassword = formData.get('newPassword');
      const confirmPassword = formData.get('confirmPassword');

      // Add loading state
      form.classList.add('loading');
      clearMessages();

      // Validation
      if (newPassword !== confirmPassword) {
        showMessage(resetMessage, 'Passwords do not match');
        form.classList.remove('loading');
        return;
      }

      if (newPassword.length < 6) {
        showMessage(resetMessage, 'Password must be at least 6 characters');
        form.classList.remove('loading');
        return;
      }

      // Check reset code
      const storedResetData = resetCodes[email];
      if (!storedResetData || storedResetData.code !== resetCode.toUpperCase()) {
        showMessage(resetMessage, 'Invalid reset code');
        form.classList.remove('loading');
        return;
      }

      if (Date.now() > storedResetData.expires) {
        showMessage(resetMessage, 'Reset code has expired');
        form.classList.remove('loading');
        return;
      }

      // Simulate API delay
      await new Promise(resolve => setTimeout(resolve, 1000));

      // Update password
      const userIndex = users.findIndex(u => u.email === email);
      if (userIndex !== -1) {
        users[userIndex].password = newPassword;
        localStorage.setItem('hackerAuthUsers', JSON.stringify(users));

        // Remove used reset code
        delete resetCodes[email];
        localStorage.setItem('hackerResetCodes', JSON.stringify(resetCodes));

        showMessage(resetMessage, 'Password reset successfully! Please login.', false);
        
        setTimeout(() => {
          form.reset();
          showForm('signin');
          form.classList.remove('loading');
        }, 1500);
      } else {
        showMessage(resetMessage, 'User not found');
        form.classList.remove('loading');
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('hackerCurrentUser');
      showForm('signin');
    }

    // Initialize with some demo users for testing
    if (users.length === 0) {
      users = [
        { username: 'admin', email: 'admin@hacker.com', password: 'admin123' },
        { username: 'hacker', email: 'hacker@system.com', password: 'hack123' }
      ];
      localStorage.setItem('hackerAuthUsers', JSON.stringify(users));
    }
  </script>
</body>
</html>
